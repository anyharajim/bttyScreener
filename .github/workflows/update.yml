name: Update tokens
on:
  schedule: [{cron: "0 6,18 * * *"}]   # twice daily, UTC
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update.py
        env:
          UNISAT_API_KEY: ${{ secrets.UNISAT_API_KEY }}
      - run: |
          git config user.name "bttyScreener bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "data update" && git push)
